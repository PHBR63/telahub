services:
  app:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_PATH: /data/telahub.db
      PORT: 3000
      NODE_ENV: production
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 320m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    init: true
    command: ["--config", "/etc/livekit.yaml"]
    volumes:
      - ./infra/livekit.yaml:/etc/livekit.yaml:ro
    network_mode: host
    mem_limit: 300m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    init: true
    depends_on:
      app:
        condition: service_healthy
      livekit:
        condition: service_started
    network_mode: host
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: 128m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
